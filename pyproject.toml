[project]
name = "maintainer-radar"
version = "0.1.0"
description = "Turn GitHub issues and pull requests into a prioritized maintainer digest."
readme = "README.md"
license = "MIT"
authors = [{ name = "Gowtham Ram" }]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/gowthamram/maintainer-radar"
Issues = "https://github.com/gowthamram/maintainer-radar/issues"

[project.scripts]
maintainer-radar = "maintainer_radar.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maintainer_radar"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
